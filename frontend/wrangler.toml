name = "aramakisai-web"
main = "workers/site-entry.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# aramakisai.com (apex) の custom domain 紐付けは aramakisai-infra 側 Terraform
# (dns.tf の cloudflare_workers_domain.aramakisai_web_prod) で管理する。
workers_dev = false

# wrangler 4.44.0 以降、preview_urls の既定は workers_dev に追従する。既定のままだと
# `wrangler versions upload` が PR プレビュー URL を出力せず、frontend-ci の e2e が
# E2E_BASE_URL 空で必ず失敗する。本番を workers.dev に露出させずにバージョン単位の
# プレビュー URL だけを有効にするため、workers_dev とは独立に true を指定する。
preview_urls = true

# ログ量を抑えるため 10% サンプリングで Workers Logs を有効にする。
[observability]
enabled = true
head_sampling_rate = 0.1

# Worker の暴走による CPU 課金の歯止め。Free プランでは cpu_ms を付けると Cloudflare API が
# 100328 で拒否するため、CI は失敗時に [limits] を外した一時設定で 1 回だけ再実行する
# (scripts/deploy-with-cpu-limit-fallback.ts)。env.dev には継承されるので再掲しない。
[limits]
cpu_ms = 5000

[assets]
directory = ".open-next/assets"

# OpenNext の ISR incremental cache (R2)。prod と PR プレビューが共有する。
# キーには OPEN_NEXT_BUILD_ID が含まれるため、ビルド間でエントリは混ざらない。
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "aramakisai-web-cache"

# サイネージのハブ(別Worker)のDO。DOを実装するWorkerにはバージョンURLが出ないため、
# サイト側は script_name で参照するだけにしてマイグレーションを書かない。
[[durable_objects.bindings]]
name = "SIGNAGE_HUB"
class_name = "SignageHub"
script_name = "aramakisai-signage-hub"

# revalidate 時に自身を呼び出すための self service binding
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "aramakisai-web"

# スタンプラリーの記録 (D1)・計測 (Analytics Engine)・IP 単位のレート制限。
# STAMP_ENV は [vars] に置かず、デプロイ時の secrets-file とローカル起動スクリプトから渡す。
# STAFF_OIDC_CLIENT_ID は秘密値ではないため [vars] に置く (本番と dev は同じ Zitadel アプリを共用する)。
[[d1_databases]]
binding = "STAMP_DB"
database_name = "aramakisai-stamps"
database_id = "534d1e5f-bbef-4a61-bc90-83e2df91f4d0"

[[analytics_engine_datasets]]
binding = "STAMP_METRICS"
dataset = "aramakisai_stamp_metrics"

[[ratelimits]]
name = "STAMP_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 120
period = 60

[vars]
STAFF_OIDC_ISSUER = "https://idp.aramakisai.com"
STAFF_OIDC_CLIENT_ID = "397250054592659458"

# dev ブランチ向け永続レビュー環境 (dev.aramakisai.com, CF Access保護)。
# 本番用 worker とは別名にし、`opennextjs-cloudflare deploy --env=dev` /
# `wrangler deploy --env=dev` で本番設定と衝突せずデプロイできるようにする。
# custom domain (dev.aramakisai.com) の紐付けは aramakisai-infra 側 Terraform で管理する。
# (aramakisai-infra側のcloudflare_workers_domainがこのenvironmentの存在を前提とするため、
#  先にこのenvironmentをデプロイしておく必要がある)
[env.dev]
name = "aramakisai-web-dev"

# observability は env に継承されないため再掲する。
[env.dev.observability]
enabled = true
head_sampling_rate = 0.1

[env.dev.assets]
directory = ".open-next/assets"

# r2_buckets / services / vars は env に継承されないため再掲する。
# 同じ bucket を使うので、prefix で本番のキャッシュと分離する。
[env.dev.vars]
NEXT_INC_CACHE_R2_PREFIX = "dev"
STAFF_OIDC_ISSUER = "https://idp.aramakisai.com"
STAFF_OIDC_CLIENT_ID = "397250054592659458"

[[env.dev.r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "aramakisai-web-cache"

[[env.dev.services]]
binding = "WORKER_SELF_REFERENCE"
service = "aramakisai-web-dev"

# env.dev も本番のハブに繋ぐ(ハブに dev 環境は無い)。bindings は env に継承されないため再掲する。
[[env.dev.durable_objects.bindings]]
name = "SIGNAGE_HUB"
class_name = "SignageHub"
script_name = "aramakisai-signage-hub"

# d1_databases / analytics_engine_datasets / ratelimits / vars も env に継承されないため再掲する。
# dev の D1 は本番と別。ratelimits の namespace_id はアカウント内で一意にする。
[[env.dev.d1_databases]]
binding = "STAMP_DB"
database_name = "aramakisai-stamps-dev"
database_id = "9275b4b9-2da3-4058-85f1-43aa5040f04c"

[[env.dev.analytics_engine_datasets]]
binding = "STAMP_METRICS"
dataset = "aramakisai_stamp_metrics"

[[env.dev.ratelimits]]
name = "STAMP_RATE_LIMITER"
namespace_id = "1002"
[env.dev.ratelimits.simple]
limit = 120
period = 60
