name = "aramakisai-signage-hub"
main = "index.ts"
compatibility_date = "2024-12-30"

# 公開のURLを持たせない。ハブはサイトのWorkerのDO binding経由でしか呼べない。
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "SIGNAGE_HUB"
class_name = "SignageHub"

# DOのクラスを含む版は `wrangler versions upload` で出せないので、常に `wrangler deploy` で出す。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignageHub"]

# pin の取り直し用。devとPRプレビューのサイトも本番のハブに繋ぐため、取り直し先は本番のサイトのみ。
[[services]]
binding = "SITE"
service = "aramakisai-web"
