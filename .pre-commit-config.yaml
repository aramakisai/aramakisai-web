repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Payload が生成するファイルは整形すると再生成時に差分が出て CI が落ちる
      - id: trailing-whitespace
        exclude: '(\.md$|^cms/src/payload-types\.ts$|^frontend/src/cms-types\.ts$|^cms/src/migrations/.*\.(ts|json)$)'
      - id: end-of-file-fixer
        exclude: '(\.md$|^cms/src/payload-types\.ts$|^frontend/src/cms-types\.ts$|^cms/src/migrations/.*\.(ts|json)$)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
        exclude: ^directus/schema/snapshot\.yaml$

  - repo: local
    hooks:
      - id: check-confidential-info
        name: Check Confidential Info
        entry: python scripts/check-confidential-info.py
        language: python
        files: \.(ts|tsx|js|json|md|yaml|yml)$
        pass_filenames: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.0
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]
