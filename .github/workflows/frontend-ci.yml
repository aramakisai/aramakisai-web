name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  push:
    branches: [main, dev]
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

defaults:
  run:
    working-directory: frontend

env:
  STATIC_ARCHIVE_KEEP: 20
  STATIC_ARCHIVE_BUCKET: aramakisai-web-cache

# Least-privilege default: this job never touches secrets (dummy build env only),
# so fork PRs can run it safely without any repository secret exposure.
permissions:
  contents: read

# push (デプロイ) は中断しない。中断してよいのは PR 実行のみ
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: type-check / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager pin lives in frontend/, not the repo root.
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # env.ts validates these at build time via ./src/env.
          # Dummy values keep the schema check honest without real secrets.
          NEXT_PUBLIC_CMS_URL: https://cms.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com

  local-fixture-e2e:
    name: e2e (local fixture)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_LOCAL_APP: "1"
      E2E_BASE_URL: http://127.0.0.1:3011
      NEXT_PUBLIC_CMS_URL: http://127.0.0.1:18055
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3011
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright_version
        run: |
          echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run local fixture E2E tests
        run: pnpm exec playwright test --grep '@local-fixture'

      - name: Upload Playwright report (trace/screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local-fixture
          path: frontend/playwright-report/
          retention-days: 7

  verify-build-artifacts:
    name: verify build artifacts (no dev code)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-verify-build-artifacts-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-verify-build-artifacts-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 開発用フラグを与えない、本番相当のビルドを対象にする。
      - name: Check build artifacts for dev code
        run: pnpm check:build-artifacts
        env:
          NEXT_PUBLIC_CMS_URL: https://cms.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com

  deploy-preview:
    name: deploy preview (Workers)
    # validate と並列実行する (クリティカルパス短縮)。validate 失敗時も PR はマージ不可のため安全性は保たれる
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.upload_preview.outputs.url }}
    env:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-deploy-preview-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-deploy-preview-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        uses: ./.github/actions/setup-infisical

      - name: Infisical login
        run: |
          echo "INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --plain --silent)" >> "$GITHUB_ENV"
          echo "INFISICAL_PROJECT_ID=$(python3 -c "import json;print(json.load(open('.infisical.json'))['workspaceId'])")" >> "$GITHUB_ENV"

      - name: Build (staging env, inlined by Infisical; Directus URL forced to prod for read-only preview data)
        # PR プレビューはアクセス制御されたプレビュー環境として扱い、開発用フェーズ切替 UI (要件 7-5) を有効にする。
        # 実在しない測定 ID を渡すのは、e2e で dataLayer を読むため。本番の ID だと実行委員の閲覧が本番プロパティに混ざる。
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- env NEXT_PUBLIC_CMS_URL=https://cms.aramakisai.com NEXT_PUBLIC_ENABLE_PHASE_OVERRIDE=true NEXT_PUBLIC_GA_MEASUREMENT_ID=G-PREVIEW000 pnpm exec opennextjs-cloudflare build

      - name: Write Workers secrets file (staging)
        # 値は echo しない。未設定なら KeyError でステップを失敗させてデプロイを止める。
        run: |
          infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- python3 -c 'import json,os; json.dump({"STAMP_SIGNING_SECRET": os.environ["STAMP_SIGNING_SECRET"], "STAMP_ENV": "preview"}, open(os.environ["RUNNER_TEMP"] + "/workers-secrets.json", "w"))'

      - name: Apply D1 migrations (dev DB)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec wrangler d1 migrations apply STAMP_DB --remote --env=dev

      # プレビューは本番 Worker のバージョンなので、一時設定で STAMP_DB を dev の D1 に差し替える。
      - name: Write preview wrangler config (STAMP_DB -> dev)
        run: pnpm exec tsx scripts/write-preview-wrangler-config.ts .wrangler.preview.toml

      - name: Upload Cloudflare Workers preview version
        id: upload_preview
        run: |
          OUTPUT=$(infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/deploy-with-cpu-limit-fallback.ts pnpm exec wrangler versions upload --config .wrangler.preview.toml --secrets-file "$RUNNER_TEMP/workers-secrets.json")
          echo "$OUTPUT"
          # wrangler はバージョンのプレビュー URL を出力しないため、バージョン ID から組み立てる。
          # 形式は https://<バージョン ID の先頭 8 文字>-<worker 名>.<アカウントのサブドメイン>.workers.dev
          VERSION_ID=$(echo "$OUTPUT" | sed -n 's/^Worker Version ID: \([0-9a-f-]*\)$/\1/p' | head -n1)
          if [ -z "$VERSION_ID" ]; then
            echo "::error::wrangler versions upload の出力から Worker Version ID を取得できなかった"
            exit 1
          fi
          echo "url=https://${VERSION_ID:0:8}-aramakisai-web.aramakisai.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Remove Workers secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/workers-secrets.json" .wrangler.preview.toml

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: Cloudflare Workers Preview

      - name: Comment preview URL on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### Cloudflare Workers Preview

            ${{ steps.upload_preview.outputs.url }}

            本番 Directus (`https://api.aramakisai.com`) の読み取り専用データを表示するビルドです。

  e2e:
    name: e2e (staging preview)
    needs: deploy-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      E2E_BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright_version
        run: |
          echo "version=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # ブラウザ本体はキャッシュ済みだが OS の共有ライブラリはランナーイメージに依存するため毎回確認する
      - name: Install Playwright OS dependencies
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Install Infisical CLI
        uses: ./.github/actions/setup-infisical

      - name: Infisical login
        run: |
          echo "INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --plain --silent)" >> "$GITHUB_ENV"
          echo "INFISICAL_PROJECT_ID=$(python3 -c "import json;print(json.load(open('.infisical.json'))['workspaceId'])")" >> "$GITHUB_ENV"

      - name: Wait for preview to become reachable
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/wait-for-preview.ts

      - name: Run staging preview E2E tests
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- env NEXT_PUBLIC_CMS_URL=https://cms.aramakisai.com pnpm exec playwright test --grep-invert '@local-fixture'

      - name: Upload Playwright report (trace/screenshot)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging-preview
          path: frontend/playwright-report/
          retention-days: 7

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "### e2e (staging preview) failed"
            echo "- preview URL: ${E2E_BASE_URL}"
            echo "- diagnostics: see the \`playwright-report\` artifact attached to this job"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: deploy dev (Workers)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-deploy-dev-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-deploy-dev-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        uses: ./.github/actions/setup-infisical

      - name: Infisical login
        run: |
          echo "INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --plain --silent)" >> "$GITHUB_ENV"
          echo "INFISICAL_PROJECT_ID=$(python3 -c "import json;print(json.load(open('.infisical.json'))['workspaceId'])")" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_CMS_URL: https://cms.aramakisai.com
          NEXT_PUBLIC_SITE_URL: https://dev.aramakisai.com
          # deploy-preview にも同フラグを付与している (要件 7-5)。deploy-prod には付与しない。
          NEXT_PUBLIC_ENABLE_PHASE_OVERRIDE: 'true'

      - name: Pack current static assets
        run: pnpm exec tsx scripts/static-archive.ts pack --dir .open-next/assets/_next/static --out "$RUNNER_TEMP/static-current.tar.gz"

      - name: Upload current static assets (dev)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/static-archive.ts upload --bucket "$STATIC_ARCHIVE_BUCKET" --target dev --sha "$GITHUB_SHA" --archive "$RUNNER_TEMP/static-current.tar.gz"

      - name: Restore previous static assets (dev)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/static-archive.ts restore --bucket "$STATIC_ARCHIVE_BUCKET" --target dev --dir .open-next/assets/_next/static

      - name: Write Workers secrets file (staging)
        # 値は echo しない。未設定なら KeyError でステップを失敗させてデプロイを止める。
        run: |
          infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- python3 -c 'import json,os; json.dump({"STAMP_SIGNING_SECRET": os.environ["STAMP_SIGNING_SECRET"], "STAMP_ENV": "dev"}, open(os.environ["RUNNER_TEMP"] + "/workers-secrets.json", "w"))'

      # 本番と dev は同じ Zitadel アプリを使うため、client secret は prod から読む。
      - name: Add staff OIDC client secret to Workers secrets file (prod)
        run: |
          infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- python3 -c 'import json,os; p = os.environ["RUNNER_TEMP"] + "/workers-secrets.json"; d = json.load(open(p)); d["STAFF_OIDC_CLIENT_SECRET"] = os.environ["STAFF_OIDC_CLIENT_SECRET"]; json.dump(d, open(p, "w"))'

      - name: Apply D1 migrations (dev)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec wrangler d1 migrations apply STAMP_DB --remote --env=dev

      - name: Deploy to Cloudflare Workers (dev)
        id: deploy_site
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/deploy-with-cpu-limit-fallback.ts pnpm exec wrangler deploy --env=dev --secrets-file "$RUNNER_TEMP/workers-secrets.json"

      - name: Remove Workers secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/workers-secrets.json"

      - name: Publish static assets generation (dev)
        if: ${{ always() && steps.deploy_site.outcome == 'success' }}
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=staging -- pnpm exec tsx scripts/static-archive.ts publish --bucket "$STATIC_ARCHIVE_BUCKET" --target dev --sha "$GITHUB_SHA" --keep "$STATIC_ARCHIVE_KEEP"

  deploy-prod:
    name: deploy prod (Workers)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # リレーのパス差分を前のコミットと比べるため。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-deploy-prod-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-deploy-prod-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Infisical CLI
        uses: ./.github/actions/setup-infisical

      - name: Infisical login
        run: |
          echo "INFISICAL_TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" \
            --client-secret="$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" \
            --plain --silent)" >> "$GITHUB_ENV"
          echo "INFISICAL_PROJECT_ID=$(python3 -c "import json;print(json.load(open('.infisical.json'))['workspaceId'])")" >> "$GITHUB_ENV"

      # サイトの Worker が script_name で参照するため、ハブを先に出す。
      # DO のクラスを含む版は versions upload で出せないので wrangler deploy を使う。
      - name: Deploy signage hub to Cloudflare Workers (prod)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec wrangler deploy -c workers/signage-hub/wrangler.toml

      - name: Build (prod env, inlined by Infisical)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec opennextjs-cloudflare build

      - name: Pack current static assets
        run: pnpm exec tsx scripts/static-archive.ts pack --dir .open-next/assets/_next/static --out "$RUNNER_TEMP/static-current.tar.gz"

      - name: Upload current static assets (prod)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec tsx scripts/static-archive.ts upload --bucket "$STATIC_ARCHIVE_BUCKET" --target prod --sha "$GITHUB_SHA" --archive "$RUNNER_TEMP/static-current.tar.gz"

      - name: Restore previous static assets (prod)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec tsx scripts/static-archive.ts restore --bucket "$STATIC_ARCHIVE_BUCKET" --target prod --dir .open-next/assets/_next/static

      - name: Write Workers secrets file (prod)
        # プレビューは本番と同じ Worker に staging の値を積む。本番デプロイでも明示しないとプレビューの値が引き継がれうる。
        # 値は echo しない。未設定なら KeyError でステップを失敗させてデプロイを止める。
        run: |
          infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- python3 -c 'import json,os; json.dump({"STAMP_SIGNING_SECRET": os.environ["STAMP_SIGNING_SECRET"], "STAMP_ENV": "prod", "STAFF_OIDC_CLIENT_SECRET": os.environ["STAFF_OIDC_CLIENT_SECRET"]}, open(os.environ["RUNNER_TEMP"] + "/workers-secrets.json", "w"))'

      - name: Apply D1 migrations (prod)
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec wrangler d1 migrations apply STAMP_DB --remote

      - name: Deploy to Cloudflare Workers (prod)
        id: deploy_site
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec tsx scripts/deploy-with-cpu-limit-fallback.ts pnpm exec opennextjs-cloudflare deploy --secrets-file "$RUNNER_TEMP/workers-secrets.json"

      - name: Remove Workers secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/workers-secrets.json"

      # 差分を取れない(前のコミットが全0・履歴に無い)ときは出す側に倒す。
      - name: Detect signage relay changes
        id: relay
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- frontend/workers/signage-quake > "$RUNNER_TEMP/relay-diff.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -s "$RUNNER_TEMP/relay-diff.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write signage relay secrets file (prod)
        if: steps.relay.outputs.changed == 'true'
        # 値は echo しない。未設定なら KeyError でステップを失敗させてデプロイを止める。
        run: |
          infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- python3 -c 'import json,os; json.dump({k: os.environ[k] for k in ("SIGNAGE_QUAKE_TOKEN", "DISCORD_QUAKE_WEBHOOK_URL")}, open(os.environ["RUNNER_TEMP"] + "/quake-secrets.json", "w"))'

      # ハブが先に出ている前提。ファイルに無いキーは削除されない。
      - name: Deploy signage relay to Cloudflare Workers (prod)
        if: steps.relay.outputs.changed == 'true'
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec wrangler deploy -c workers/signage-quake/wrangler.toml --secrets-file "$RUNNER_TEMP/quake-secrets.json"

      - name: Remove signage relay secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/quake-secrets.json"

      - name: Publish static assets generation (prod)
        if: ${{ always() && steps.deploy_site.outcome == 'success' }}
        run: infisical run --token="$INFISICAL_TOKEN" --projectId="$INFISICAL_PROJECT_ID" --env=prod -- pnpm exec tsx scripts/static-archive.ts publish --bucket "$STATIC_ARCHIVE_BUCKET" --target prod --sha "$GITHUB_SHA" --keep "$STATIC_ARCHIVE_KEEP"
