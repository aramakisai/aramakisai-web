name: Dependency Parity

on:
  pull_request:
    branches: [main, dev]
    paths:
      - frontend/package.json
      - cms/package.json
      - .github/workflows/dependency-parity.yml

permissions:
  contents: read

jobs:
  check:
    name: frontend と cms の依存バージョン一致を検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Next.js / React を片方だけ上げると、共有する cms-types や UI 前提がずれたまま
      # 両方の CI が通ってしまうため、指定文字列の完全一致を強制する
      - name: Compare pinned versions
        run: |
          node -e '
            const read = (p) => JSON.parse(require("fs").readFileSync(p, "utf8"));
            const fe = read("frontend/package.json");
            const cms = read("cms/package.json");
            const pick = (p, k) => (p.dependencies ?? {})[k] ?? (p.devDependencies ?? {})[k];
            const keys = ["next", "react", "react-dom", "eslint-config-next", "@types/react", "@types/react-dom"];
            const bad = keys.filter((k) => pick(fe, k) !== pick(cms, k));
            for (const k of bad) console.error(`${k}: frontend=${pick(fe, k)} cms=${pick(cms, k)}`);
            process.exit(bad.length ? 1 : 0);
          '
